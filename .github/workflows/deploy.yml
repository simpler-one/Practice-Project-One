name: Lint,Test and Deploy
on: push
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run Lint
              run: npm run lint
    test:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run Tests
              run: npm test
    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v6
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run Build
              run: npm run build
            - name: Run Deployment
              run: echo" Deploying to production..."